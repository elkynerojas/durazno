# Integración continua (HU-04): cada push y pull request pasa linters, pruebas y escaneo de
# seguridad. Falla si falla cualquiera de los trabajos.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest con PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: icota
          POSTGRES_PASSWORD: icota
          POSTGRES_DB: durazno_icota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icota -d durazno_icota"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: icota
      POSTGRES_PASSWORD: icota
      POSTGRES_DB: durazno_icota
      ENVIRONMENT: test
      PGPASSWORD: icota
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Extensiones de la base (como db/init en Docker)
        run: psql -h localhost -U icota -d durazno_icota -v ON_ERROR_STOP=1 -f ../db/init/01-extensiones.sql
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest --cov --cov-report=term

  frontend:
    name: Frontend (oxlint + vitest + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright sobre el stack de Docker)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Variables de entorno de prueba
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^E2E_CLAVE=.*|E2E_CLAVE=e2e-$(openssl rand -hex 12)|" .env
          sed -i "s|^VITE_USE_POLLING=.*|VITE_USE_POLLING=false|" .env
      - name: Levantar base, API y frontend
        run: docker compose up -d --build db api frontend
      - name: Esperar a la API y al frontend
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T api python -c "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')" 2>/dev/null \
              && docker compose exec -T frontend wget -qO- http://localhost:5173 >/dev/null 2>&1; then
              echo "Listo"; exit 0
            fi
            sleep 5
          done
          docker compose logs api frontend
          exit 1
      - run: docker compose exec -T api python -m app.scripts.sembrar_e2e
      - run: docker compose --profile e2e run --rm e2e npx playwright test --retries=1
      - name: Registros si falla
        if: failure()
        run: docker compose logs --tail=200 api frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  seguridad:
    name: Seguridad (pip-audit, npm audit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias de Python
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de producción del frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Secretos en el historial
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
