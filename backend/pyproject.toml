[project]
name = "durazno-icota-api"
version = "0.1.0"
description = "API de trazabilidad geolocalizada del trampeo de moscas de la fruta - Icota, Cácota"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
