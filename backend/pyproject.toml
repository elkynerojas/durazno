[project]
name = "durazno-icota-api"
version = "0.1.0"
description = "API de trazabilidad geolocalizada del trampeo de moscas de la fruta - Icota, Cácota"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# En pruebas se usan assert y claves ficticias.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
