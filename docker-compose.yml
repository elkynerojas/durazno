name: durazno-icota

services:
  db:
    image: postgis/postgis:18-3.6
    # La imagen oficial solo se publica para amd64; en Apple Silicon se emula.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
    ports:
      # Solo para clientes SQL o QGIS del mismo equipo; no se publica en la red.
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      # PostgreSQL 18 guarda los datos en /var/lib/postgresql/<versión>/...
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # Aplica las migraciones pendientes y arranca con recarga automática.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --proxy-headers --forwarded-allow-ips='*'"
    # Solo accesible dentro de la red de Docker; desde el equipo se entra por nginx.
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Instala dependencias si cambió package-lock.json y arranca Vite. Se ejecuta desde
    # el código montado para que funcione aunque la imagen no se haya reconstruido.
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Conserva el node_modules instalado en la imagen (Linux) aunque se
      # monte el código del anfitrión encima.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # pgAdmin corre sin contraseña maestra: solo accesible desde este equipo.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  # Pruebas E2E con Playwright. No arranca con `up`; se ejecuta con:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /app
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["npx", "playwright", "test"]
    # Comparte la red del frontend: la app se abre en http://localhost:5173, contexto seguro que
    # el navegador exige para la geolocalización y la cámara.
    network_mode: "service:frontend"
    environment:
      E2E_CORREO: ${E2E_CORREO:-e2e-agronomo@example.com}
      E2E_CLAVE: ${E2E_CLAVE:-}
    volumes:
      - ./frontend:/app
      # node_modules propio: la imagen de Playwright es glibc y la del frontend, alpine.
      - e2e_node_modules:/app/node_modules
    depends_on:
      - frontend

volumes:
  pgdata:
  pgadmin_data:
  frontend_node_modules:
  e2e_node_modules:
