# Proxy inverso: publica la API (FastAPI) en el puerto 80.
server {
    listen 80;
    server_name _;

    server_tokens off;

    # Cabeceras de seguridad. CSP y HSTS se agregan con HTTPS en producción (HU-08).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Cámara (lectura de QR) y ubicación (GPS) solo para el propio sitio.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Permite subir GeoJSON/KML de lotes con muchos vértices.
    client_max_body_size 10m;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
