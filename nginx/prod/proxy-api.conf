# Proxy hacia la API. Define su propia cabecera, así que repite las de seguridad (Nginx no
# hereda add_header del server cuando el location agrega alguna).
include /etc/nginx/snippets/seguridad.conf;
# Usuarios, tokens y datos del predio no deben quedar en cachés intermedias.
add_header Cache-Control "no-store" always;

proxy_pass http://api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se reemplaza (no se agrega) para que un cliente no pueda inyectar una IP falsa.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
