# Cabeceras de seguridad comunes. Se incluyen en cada location que agrega sus propias
# cabeceras, porque Nginx no hereda add_header del server en ese caso.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Cámara (lectura de QR) y ubicación (GPS) solo para el propio sitio.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
# Mapas: teselas satelitales de Esri y de OpenStreetMap. Leaflet aplica estilos en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
